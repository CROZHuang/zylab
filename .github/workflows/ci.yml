# zylab 的跨平台门禁。
#
# 为什么要有 Windows 这一列：Windows 兼容层是 2026-09 移植进来的，而移植
# 本身在 Linux 上验不出来 —— 它引进的三个真 bug（graft_worker 当脚本跑时
# 找不到包、拿不到锁返回 False 而不是抛 BlockingIOError、模块级 import
# fcntl）全是靠人肉在两个平台各跑一遍才发现的。没有 Windows CI 的话，
# 下一次合并会再把同样的东西带回来（实测：git 自动合并已经带回来过一次）。
#
# 零三方依赖、纯标准库，所以这里没有任何安装步骤 —— 装依赖的那一步不存在，
# 就不会有「CI 装得上、用户装不上」这类问题。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # macOS 从未有人实跑过，先作为探路列：红了要看，但不挡 Windows/Linux。
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}     # README 承诺的最低版本
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # AGENTS.md §3：测试不得写进真实状态目录。CI 上没有"真实用户"，
      # 但把它钉死能让这条规则在每次跑的时候都被执行一遍，而不只是写在文档里。
      - name: 把状态目录改道到 runner 的临时盘
        shell: bash
        run: echo "ZYLAB_HOME=$RUNNER_TEMP/zylab-home" >> "$GITHUB_ENV"

      # 环境事实先打一行。2026-09-21 第一次跑 CI 时五列全红，而同一个提交在
      # 维护者机器上（python 3.12）全绿——差异只能是环境，而 job 日志要仓库
      # admin 权限才下载得到。把判据打出来，别再靠猜。
      - name: 环境事实
        shell: bash
        run: |
          python -VV
          python -c "import sys,platform,locale,os;print('platform:',platform.platform());print('encoding:',sys.getdefaultencoding(),locale.getpreferredencoding(False));print('TERM=',os.environ.get('TERM'));print('cwd:',os.getcwd())"
          git --version
          bash --version | head -1

      # 失败时把失败信息写成 ::error:: 注解。注解可以通过 check-runs API
      # **无需 admin 权限**读到，而 job 日志不行——这条 CI 的意义就在于让
      # 只有某个平台才暴露的问题能被没有那个平台的人看见。
      #
      # 日志名刻意用**相对路径**：Git Bash 的 `/tmp` 与 Windows 的 python 看到的
      # 不是同一个地方（后者把 `/tmp/x` 当盘符相对路径去找 `C:\tmp\x`），
      # 第一版就是这么在 Windows 上一条注解都没出来的。
      - name: 单元测试
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q 2>&1 | tee unit.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            python scripts/ci_annotate.py unit.log || true
          fi
          exit "$rc"

      # CC 交互契约记分板。它会在真 PTY（Windows 上是 ConPTY）里跑，
      # 所以这一步同时也是 tests/conpty.py 的冒烟。
      - name: 交互契约记分板
        shell: bash
        run: |
          set +e
          python scripts/cc_parity.py 2>&1 | tee parity.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            python scripts/ci_annotate.py parity.log || true
          fi
          exit "$rc"

      # AGENTS.md §3 的硬断言只有一条：**别写进真实状态目录**。
      # "改道目录里有东西"只是旁证（哪个用例碰到它是偶然的），所以只打印不判死。
      - name: 状态目录守卫没被绕过
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/zylab-home" ]; then
            echo "改道生效，落在：$RUNNER_TEMP/zylab-home"
          else
            echo "（本轮没有用例碰过改道后的状态目录）"
          fi
          for stray in "$HOME/.zylab" "${USERPROFILE:-}/.zylab"; do
            case "$stray" in /.zylab) continue ;; esac
            if [ -e "$stray" ]; then
              echo "测试写进了真实状态目录：$stray"; exit 1
            fi
          done
